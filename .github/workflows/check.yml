name: Tsukimera · проверка оболочки
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Проверить синтаксис и локальные настройки
        run: npm test
      - name: Проверить справку запуска
        run: node scripts/launch.mjs --help
  linux-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверки Node 24
        run: npm test
  windows-bat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверка интерфейса и API на Windows
        run: npm test
      - name: Проверка единого BAT
        shell: cmd
        run: Tsukimera.bat --help
